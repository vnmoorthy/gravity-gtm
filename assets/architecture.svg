<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b13"/><stop offset="1" stop-color="#07070c"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity=".35"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
    <style>
      .t{fill:#f4f4f5;font-size:17px;font-weight:600}
      .s{fill:#a1a1aa;font-size:12.5px}
      .h{fill:#f59e0b;font-size:12px;letter-spacing:2.5px;font-weight:600}
      .box{fill:#11111b;stroke:#2a2a3d;stroke-width:1.2;rx:14}
      .ln{stroke:#52525b;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lna{stroke:#f59e0b;stroke-width:2;fill:none;marker-end:url(#aa)}
      .chip{font-size:11.5px;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="60" y="70" fill="#fff" font-size="34" font-weight="700" letter-spacing="6">GRAVITY</text>
  <text x="300" y="70" fill="#a1a1aa" font-size="18">system architecture · closed-loop, glass-box GTM engine</text>

  <!-- Frontend -->
  <text x="60" y="125" class="h">PRESENTATION · React 19 + Vite + Tailwind 4 (served by Render)</text>
  <g>
    <rect x="60" y="140" width="1480" height="96" class="box"/>
    <g font-size="13.5" fill="#e4e4e7">
      <text x="88" y="180">🚀 Mission Control</text><text x="88" y="206" class="s">intake chat/form</text>
      <text x="268" y="180">🎯 ICP Engine</text><text x="268" y="206" class="s">confidence · expansion</text>
      <text x="448" y="180">🕸 3D Knowledge Graph</text><text x="448" y="206" class="s">three.js · bloom · paths</text>
      <text x="658" y="180">🏢 Accounts grid</text><text x="658" y="206" class="s">citations · enrichment</text>
      <text x="838" y="180">✅ HITL Review</text><text x="838" y="206" class="s">approve/edit/reject</text>
      <text x="1008" y="180">📋 Kanban</text><text x="1008" y="206" class="s">AI vs rep attribution</text>
      <text x="1158" y="180">📈 Analytics</text><text x="1158" y="206" class="s">funnel · A/B · $/mtg</text>
      <text x="1318" y="180">🧑‍🤝‍🧑 War Room · 💳 Gov</text><text x="1318" y="206" class="s">Band · Flexprice</text>
    </g>
  </g>
  <path d="M800 236 V 290" class="lna"/>
  <text x="815" y="270" class="s">REST + Server-Sent Events (live agent stream, graph growth, billing ticks)</text>

  <!-- Orchestrator -->
  <text x="60" y="318" class="h">ORCHESTRATION · Node 20 / Express · Planner-led multi-agent pipeline</text>
  <rect x="60" y="332" width="1480" height="250" class="box"/>
  <circle cx="800" cy="457" r="160" fill="url(#glow)"/>
  <g>
    <!-- pipeline stages -->
    <g font-size="13">
      <rect x="90" y="360" width="150" height="70" rx="12" fill="#1a1428" stroke="#f59e0b"/><text x="105" y="388" class="t" font-size="14">🧭 Planner</text><text x="105" y="410" class="s">milestones · @handoffs</text>
      <rect x="270" y="360" width="150" height="70" rx="12" fill="#17142a" stroke="#a78bfa"/><text x="285" y="388" class="t" font-size="14">🎯 Strategist</text><text x="285" y="410" class="s">ICP + expansion</text>
      <rect x="450" y="360" width="150" height="70" rx="12" fill="#0f1d24" stroke="#22d3ee"/><text x="465" y="388" class="t" font-size="14">🛰 Scout</text><text x="465" y="410" class="s">web search · citations</text>
      <rect x="630" y="360" width="150" height="70" rx="12" fill="#24121a" stroke="#fb7185"/><text x="645" y="388" class="t" font-size="14">⚔ Analyst</text><text x="645" y="410" class="s">competitor map</text>
      <rect x="810" y="360" width="150" height="70" rx="12" fill="#15162a" stroke="#818cf8"/><text x="825" y="388" class="t" font-size="14">🕸 Cartographer</text><text x="825" y="410" class="s">graph · multi-hop</text>
      <rect x="990" y="360" width="150" height="70" rx="12" fill="#0f2019" stroke="#34d399"/><text x="1005" y="388" class="t" font-size="14">🧬 Enricher</text><text x="1005" y="410" class="s">DNS · MX · Hunter</text>
      <rect x="1170" y="360" width="150" height="70" rx="12" fill="#25121e" stroke="#f472b6"/><text x="1185" y="388" class="t" font-size="14">✍ Writer</text><text x="1185" y="410" class="s">A/B sequences</text>
      <rect x="1350" y="360" width="160" height="70" rx="12" fill="#221f0e" stroke="#facc15"/><text x="1365" y="388" class="t" font-size="14">🔎 Reviewer</text><text x="1365" y="410" class="s">fact-check · number audit</text>
    </g>
    <path d="M240 395H268M420 395H448M600 395H628M780 395H808M960 395H988M1140 395H1168M1320 395H1348" class="ln"/>
    <g font-size="13">
      <rect x="1350" y="455" width="160" height="62" rx="12" fill="#0d2121" stroke="#2dd4bf"/><text x="1365" y="481" class="t" font-size="14">🪞 Buyer Twin</text><text x="1365" y="502" class="s">reply-odds pre-flight</text>
      <rect x="1170" y="455" width="150" height="62" rx="12" fill="#260f0f" stroke="#ef4444"/><text x="1185" y="481" class="t" font-size="14">🛡 Sentinel</text><text x="1185" y="502" class="s">links · PII · injection</text>
      <rect x="990" y="455" width="150" height="62" rx="12" fill="#192309" stroke="#84cc16"/><text x="1005" y="481" class="t" font-size="14">💳 Governor</text><text x="1005" y="502" class="s">meter · gate · 402</text>
      <rect x="660" y="455" width="300" height="100" rx="14" fill="#1d1608" stroke="#f59e0b" stroke-width="2"/><text x="680" y="485" class="t">🧑 Human-in-the-loop gate</text><text x="680" y="508" class="s">ICP approval · edit / rewrite / reject</text><text x="680" y="528" class="s">nothing is sent without a human click</text><text x="680" y="546" class="s">decisions from UI or Band room</text>
    </g>
    <path d="M1430 430V453M1350 486H1322M1170 486H1142M990 486H962" class="ln"/>
    <g>
      <rect x="90" y="455" width="540" height="100" rx="14" fill="#0e0e17" stroke="#3b3b55" stroke-dasharray="5 4"/>
      <text x="110" y="484" class="t" font-size="15">Shared state + event bus</text>
      <text x="110" y="507" class="s">entities · audit log (AI vs rep) · telemetry ($, tokens per agent)</text>
      <text x="110" y="527" class="s">credit ledger · approvals · JSON snapshot persistence</text>
      <text x="110" y="547" class="s">Signal Radar: continuous re-ingestion › re-score › re-rank</text>
    </g>
  </g>

  <!-- data/integration layer -->
  <text x="60" y="630" class="h">INTELLIGENCE + DATA LAYER</text>
  <g>
    <rect x="60" y="645" width="350" height="150" class="box"/>
    <text x="84" y="678" class="t">Claude · claude-opus-5-5</text>
    <text x="84" y="702" class="s">server-side web_search (dynamic filtering)</text>
    <text x="84" y="722" class="s">› citation gate: claim kept only if its URL was</text>
    <text x="84" y="742" class="s">   actually retrieved · refusal fallbacks</text>
    <text x="84" y="766" class="s">ICP · discovery · competitors · copy · review</text>

    <rect x="430" y="645" width="350" height="150" class="box"/>
    <text x="454" y="678" class="t">Knowledge Graph</text>
    <text x="454" y="702" class="s">Company · Person · Product · Competitor · Signal</text>
    <text x="454" y="722" class="s">works_at · competes_with · matched_to · contacted_via</text>
    <text x="454" y="742" class="s">replied_to · previously_employed_at · uses</text>
    <text x="454" y="766" class="s">native BFS engine ↔ Neo4j mirror (Cypher)</text>

    <rect x="800" y="645" width="350" height="150" class="box"/>
    <text x="824" y="678" class="t">Enrichment waterfall</text>
    <text x="824" y="702" class="s">DNS A › MX (provider fingerprint)</text>
    <text x="824" y="722" class="s">› pattern synthesis › Hunter.io verifier</text>
    <text x="824" y="742" class="s">› LinkedIn resolution · confidence 0–1</text>
    <text x="824" y="766" class="s">deliverability status inline in the grid</text>

    <rect x="1170" y="645" width="370" height="150" class="box"/>
    <text x="1194" y="678" class="t">Messaging</text>
    <text x="1194" y="702" class="s">Resend / SendGrid after HITL approval</text>
    <text x="1194" y="722" class="s">sandbox mode › TEST_INBOX (safe demos)</text>
    <text x="1194" y="742" class="s">reply webhook › kanban "Replied"</text>
    <text x="1194" y="766" class="s">LinkedIn: copy-to-send queue</text>
  </g>
  <path d="M235 582V643M605 582V643M975 582V643M1355 582V643" class="ln"/>

  <!-- sponsors -->
  <text x="60" y="845" class="h">SPONSOR INTEGRATIONS</text>
  <g>
    <rect x="60" y="860" width="236" height="96" rx="14" fill="#14101f" stroke="#8b5cf6"/><text x="80" y="892" class="t">Band</text><text x="80" y="915" class="s">agent room mirror via REST</text><text x="80" y="935" class="s">events + @mention HITL ↔</text>
    <rect x="308" y="860" width="236" height="96" rx="14" fill="#13190a" stroke="#84cc16"/><text x="328" y="892" class="t">Flexprice</text><text x="328" y="915" class="s">POST /v1/events per action</text><text x="328" y="935" class="s">wallet · credit gate · top-up</text>
    <rect x="556" y="860" width="236" height="96" rx="14" fill="#0e1520" stroke="#38bdf8"/><text x="576" y="892" class="t">Render</text><text x="576" y="915" class="s">render.yaml blueprint</text><text x="576" y="935" class="s">web service · healthz</text>
    <rect x="804" y="860" width="236" height="96" rx="14" fill="#1a0f1d" stroke="#c084fc"/><text x="824" y="892" class="t">Snyk</text><text x="824" y="915" class="s">SCA + SAST in GitHub CI</text><text x="824" y="935" class="s">SARIF › code scanning</text>
    <rect x="1052" y="860" width="236" height="96" rx="14" fill="#0f1b1b" stroke="#2dd4bf"/><text x="1072" y="892" class="t">Nexla</text><text x="1072" y="915" class="s">webhook source › Nexsets</text><text x="1072" y="935" class="s">leads/meetings to CRM/DW</text>
    <rect x="1300" y="860" width="240" height="96" rx="14" fill="#1d1408" stroke="#f59e0b"/><text x="1320" y="892" class="t">Blender</text><text x="1320" y="915" class="s">procedural 3D hero art</text><text x="1320" y="935" class="s">EEVEE · scripted render</text>
  </g>
</svg>
